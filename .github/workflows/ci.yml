name: CI

# One event starts one run. A push runs on main only, and a pull request runs once.
on:
  push:
    branches: [main]
  pull_request:

# A new commit on a pull request cancels the older run. A run on main always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # The shared workflow in misthelper-devtools runs each gate as its own job.
  # Each job installs requirements-dev.txt. Each check name starts with the job
  # ID, for example "gates / Ruff (lint)".
  gates:
    permissions:
      contents: read
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-python-quality-gates.yml@efd236ba17b0a7f9258ddac31168773a7af53e96 # main
    with:
      python-version: '3.13'
      cache-dependency-path: requirements-dev.txt
      timeout-minutes: 10
      ruff: true
      ruff-format: true
      pytest: true

  protocol:
    name: Generate the protocol modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate the modules from device.proto
        working-directory: starlink-api-reference/device-api
        run: python -m grpc_tools.protoc -I . --python_out=. --pyi_out=. --grpc_python_out=. device.proto
      - name: Import the generated modules
        working-directory: starlink-api-reference/device-api
        run: python -c "import device_pb2, device_pb2_grpc; print('Imported the protocol modules of', device_pb2.DESCRIPTOR.name)"

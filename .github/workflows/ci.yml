name: CI

# One event starts one run. A push runs on main only, and a pull request runs once.
on:
  push:
    branches: [main]
  pull_request:

# A new commit on a pull request cancels the older run. A run on main always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # The shared workflow in misthelper-devtools runs each gate as its own job.
  # Each job installs requirements-dev.txt. Each check name starts with the job
  # ID, for example "gates / Ruff (lint)".
  gates:
    permissions:
      contents: read
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-python-quality-gates.yml@da02d4c6a2163d1882f2ad25fce80b8ba38304d1 # v0.6.2
    with:
      python-version: '3.13'
      cache-dependency-path: requirements-dev.txt
      timeout-minutes: 10
      ruff: true
      ruff-format: true
      pytest: true

  protocol:
    name: Generate the protocol modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate the modules from device.proto
        working-directory: starlink-api-reference/device-api
        run: python -m grpc_tools.protoc -I . --python_out=. --pyi_out=. --grpc_python_out=. device.proto
      - name: Import the generated modules
        working-directory: starlink-api-reference/device-api
        run: python -c "import device_pb2, device_pb2_grpc; print('Imported the protocol modules of', device_pb2.DESCRIPTOR.name)"

  screenshots:
    name: Offline UI and screenshot capture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Qt offscreen system libraries
        run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libopengl0
      - name: Install UI and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Exercise actual widgets without a terminal
        run: python -m pytest tests/ui
      - name: Capture synthetic app views
        run: python -m tools.capture_screenshots --output "${{ runner.temp }}/starlink-screenshots"

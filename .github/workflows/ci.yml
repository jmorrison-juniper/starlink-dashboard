name: CI

# One event starts one run. A push runs on main only, and a pull request runs once.
on:
  push:
    branches: [main]
  pull_request:

# A new commit on a pull request cancels the older run. A run on main always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the test tools
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Check the format
        run: python -m ruff format --check .
      - name: Run the tests
        run: python -m pytest

  protocol:
    name: Generate the protocol modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate the modules from device.proto
        working-directory: starlink-api-reference/device-api
        run: python -m grpc_tools.protoc -I . --python_out=. --pyi_out=. --grpc_python_out=. device.proto
      - name: Import the generated modules
        working-directory: starlink-api-reference/device-api
        run: python -c "import device_pb2, device_pb2_grpc; print('Imported the protocol modules of', device_pb2.DESCRIPTOR.name)"

name: CodeQL

# The workflow scans the Python code with CodeQL and uploads the alerts to the
# code scanning page of this repository.
#
# A pull request against any base starts a scan. A branch filter on the
# pull_request event can stop the required check, so the check never reports
# and the pull request blocks. A push starts a scan on main only, so one event
# starts one run. The weekly schedule finds the alerts of a new CodeQL release.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Run every Monday at 06:00 UTC, before the stranded branch report.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# A new commit on a pull request cancels the older run. A run on main always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The job below states the permissions that it needs. The empty map here
# removes every other permission.
permissions: {}

jobs:
  # The shared workflow runs the analysis in its job named analyze. Code
  # scanning keys the alerts on this file path and that job ID, and the
  # category is /language:python. Do not rename this file, because a new
  # path starts a new set of alerts. The check name is
  # "codeql / Analyze (python)".
  codeql:
    permissions:
      # The analysis reads the run and the code, and it uploads the alerts.
      actions: read
      contents: read
      security-events: write
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-codeql.yml@da02d4c6a2163d1882f2ad25fce80b8ba38304d1 # v0.6.2
    with:
      languages: '["python"]'
      config-file: ./.github/codeql/codeql-config.yml
